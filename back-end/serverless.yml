service: albumshuffler
configValidationMode: error
frameworkVersion: '2'

provider:
  name: aws
  runtime: python3.13
  memorySize: 512
  lambdaHashingVersion: 20201221
  region: ca-central-1
  stage: ${opt:stage, 'dev'}
  apiGateway:
    shouldStartNameWithService: true
  logRetentionInDays: 30
  iamRoleStatements:
  - Effect: "Allow"
    Action:
      - dynamodb:Query
      - dynamodb:Scan
      - dynamodb:GetItem
      - dynamodb:PutItem
      - dynamodb:UpdateItem
      - dynamodb:DeleteItem
      - dynamodb:BatchWriteItem
    Resource:
      Fn::GetAtt: 
      - AlbumShufflerTable
      - Arn
  - Effect: "Allow"
    Action:
      - sqs:SendMessage
      - sqs:GetQueueUrl
      - sqs:ReceiveMessage
    Resource:
      Fn::GetAtt:
      - AlbumImportQueue
      - Arn
  httpApi:
    cors:
     maxAge: 6000

  environment:
    ALBUM_SHUFFLER_TABLE: ${self:custom.albumShufflerTable}
    ALBUM_IMPORT_QUEUE: ${self:custom.albumImportQueue}
    SPOTIFY_CLIENT_ID: ${ssm:/AlbumShuffler/${self:provider.stage}/spotify_client_id~true}
    SPOTIFY_CLIENT_SECRET: ${ssm:/AlbumShuffler/${self:provider.stage}/spotify_client_secret~true}
    JWT_SECRET: ${ssm:/AlbumShuffler/${self:provider.stage}/jwt_secret~true}
    STAGE: ${self:provider.stage}

plugins:
  - serverless-python-requirements

custom:
  albumShufflerTable: ${self:provider.stage}-AlbumShufflerTable
  albumImportQueue: ${self:provider.stage}-AlbumImportQueue

functions:
  GetRandomAlbum:
    handler: functions/get_random_album.handler
    events:
      - httpApi: 
          path: /randomalbum
          method: GET
  SpotifyAuthCallback:
    handler: functions/spotify_auth_callback.handler
    events:
      - httpApi:
          path: /spotifyauth
          method: GET
  RefreshAlbums:
    handler: functions/refresh_albums.handler
    events:
      - httpApi:
          path: /refresh
          method: POST
  AlbumImporter:
    handler: functions/album_import_handler.handler
    timeout: 300
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - AlbumImportQueue
              - Arn
          batchSize: 1

resources:
  Resources:
    AlbumShufflerTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.stage}-AlbumShufflerTable
        BillingMode: PAY_PER_REQUEST
        OnDemandThroughput:
          MaxReadRequestUnits: 20
          MaxWriteRequestUnits: 20
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: sortKey
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
          - AttributeName: sortKey
            KeyType: RANGE
    AlbumImportQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.albumImportQueue}
        MessageRetentionPeriod: 7200
    HighTrafficAlarmTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:provider.stage}-AlbumShufflerHighTrafficAlarm
        Subscription:
          - Protocol: email
            Endpoint: ${ssm:/AlbumShuffler/${self:provider.stage}/alert_email}
    HighTrafficAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:provider.stage}-AlbumShufflerHighTraffic
        AlarmDescription: Triggers when API Gateway receives more than 1000 requests in an hour
        Namespace: AWS/ApiGateway
        MetricName: Count
        Dimensions:
          - Name: ApiId
            Value: !Ref HttpApi
        Statistic: Sum
        Period: 3600
        EvaluationPeriods: 1
        Threshold: 1000
        ComparisonOperator: GreaterThanThreshold
        AlarmActions:
          - !Ref HighTrafficAlarmTopic
    HttpApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        StageName: $default
        ApiId: !Ref HttpApi
        AutoDeploy: true
        DefaultRouteSettings:
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 10
 
